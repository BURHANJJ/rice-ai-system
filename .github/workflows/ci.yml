name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    name: Leak check (files, secrets, history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the checker and its git hooks
        run: node --test scripts/check-leaks.test.mjs
      - name: Whole tree
        run: node scripts/check-leaks.mjs --all
      - name: Every commit in this push or pull request
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then range="$BEFORE..$HEAD_SHA"
          else exit 0; fi
          node scripts/check-leaks.mjs --range "$range"

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Placeholder Firebase config: enough to compile; no real project is contacted.
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_APP_ID: 1:000000000000:web:ci
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_PROJECT_ID: demo-rice-ai
      VITE_FIREBASE_AUTH_DOMAIN: demo-rice-ai.firebaseapp.com
      VITE_FIREBASE_STORAGE_BUCKET: demo-rice-ai.firebasestorage.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  firestore-rules:
    name: Firestore rules (emulator tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/firestore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/firestore/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable
          cache: true
      # The real firebase_options.dart is generated per project and git-ignored; analyze against the template.
      - run: cp lib/firebase_options.dart.example lib/firebase_options.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Cloud Functions (install + syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: node --check index.js
